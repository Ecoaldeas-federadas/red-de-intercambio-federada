# Nodo Demo - Red de Intercambio Federada
# Nodo paralelo para demostracion. NO toca el nodo principal.
# Se reinicia cada 24 horas automaticamente.
#
# Uso:
#   docker compose -f docker-compose.demo.yml up -d
#
# El nodo demo:
# - Usa la misma imagen Docker que el nodo principal
# - Tiene su propia base de datos (fmc_demo)
# - Corre en el puerto 8081
# - Se auto-configura al arrancar (sin wizard)
# - Se reinicia cada 24 horas (cron en demo-resetter)
# - Tiene datos genericos (no Feria Conuquera)

services:
  demo-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8081:8081"
      - "8444:8444"
    volumes:
      - ./config.demo.yaml:/app/config.yaml:ro
      - ./firmware:/app/firmware:ro
      - demo_uploads:/app/uploads
    depends_on:
      - yugabytedb
    environment:
      - DB_HOST=yugabytedb
      - DB_NAME=fmc_demo
      - DB_PASSWORD=${DB_PASSWORD:-fmcpassword}
      - JWT_SECRET=demo-jwt-secret-not-for-production
      - CONFIG_PATH=/app/config.yaml
      - MIGRATIONS_DIR=/app/internal/db/migrations
      - FIRMWARE_DIR=/app/firmware
      - FIRMWARE_BUILD_DIR=/tmp/firmware-builds
      - FIRMWARE_DOCKER_IMAGE=fmc-arduino-compiler:latest
      - DEMO_MODE=true
      - DEMO_DOMAIN=demo
      - DEMO_RESET_INTERVAL_HOURS=24
    restart: unless-stopped

  # Reseteador del nodo demo: borra y re-seedea cada 24 horas
  demo-resetter:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - yugabytedb
    environment:
      - DB_HOST=yugabytedb
      - DB_NAME=fmc_demo
      - DB_PASSWORD=${DB_PASSWORD:-fmcpassword}
      - JWT_SECRET=demo-jwt-secret-not-for-production
      - DEMO_MODE=true
      - DEMO_DOMAIN=demo
      - DEMO_RESET_INTERVAL_HOURS=24
    entrypoint: ["/app/scripts/demo-reset-loop.sh"]
    volumes:
      - ./scripts/demo-reset-loop.sh:/app/scripts/demo-reset-loop.sh:ro
    restart: unless-stopped

volumes:
  demo_uploads:
