# Vaultwarden - Gestor de contrasenas autoalojado (implementacion ligera de Bitwarden)
# Permite almacenar y sincronizar contrasenas de forma segura usando SQLite
version: '3.8'

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - DOMAIN=https://${DOMAIN:-localhost}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-cambio_esto}
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-false}
      - WEBSOCKET_ENABLED=true
    volumes:
      - ./data/vaultwarden:/data
    networks:
      - aldea-network

networks:
  aldea-network:
    external: true
