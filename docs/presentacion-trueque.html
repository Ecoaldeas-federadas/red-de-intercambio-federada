<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cómo funciona el Trueque Federado - Presentación Interactiva</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#059669;--green-l:#10b981;--green-d:#047857;--blue:#2563eb;--blue-l:#3b82f6;--blue-d:#1d4ed8;--amber:#d97706;--amber-l:#f59e0b;--amber-d:#b45309;--red:#ef4444;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-500:#6b7280;--gray-700:#374151;--gray-900:#111827}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--gray-50);color:var(--gray-900);overflow:hidden;height:100vh;width:100vw}

/* ===== SCENE ===== */
#scene{width:100vw;height:100vh;position:relative;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#e0f2fe 0%,#ecfdf5 30%,#f0fdf4 60%,#f9fafb 100%);
  transition:opacity .4s ease;cursor:default}
#scene.hidden{opacity:0;pointer-events:none;position:absolute}
#scene svg{width:100%;height:100%;max-width:1400px;max-height:900px}

/* Hotspots */
.hotspot{cursor:pointer;transition:filter .2s}
.hotspot:hover{filter:brightness(1.15) drop-shadow(0 0 10px rgba(16,185,129,.5))}
.hot-label{font-size:9px;fill:#6b7280;text-anchor:middle;pointer-events:none;opacity:0;transition:opacity .2s}
.hotspot:hover .hot-label{opacity:1}
.hot-hint{font-size:8px;fill:#9ca3af;text-anchor:middle;pointer-events:none}

/* ===== DETAIL ===== */
#detail{width:100vw;height:100vh;position:fixed;top:0;left:0;background:var(--gray-50);display:none;flex-direction:column;z-index:100}
#detail.active{display:flex;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.d-header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#fff;border-bottom:1px solid var(--gray-200);flex-shrink:0}
.d-header h2{font-size:16px;color:var(--gray-900)}
.d-header .num{font-size:11px;color:var(--gray-500)}
.d-body{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;align-items:center}
.d-body svg{max-width:900px;width:100%;height:auto}
.d-body .txt{max-width:680px;text-align:center;margin-top:16px}
.d-body .txt h3{font-size:20px;margin-bottom:8px;color:var(--gray-900)}
.d-body .txt p{font-size:15px;line-height:1.7;color:var(--gray-700);margin-bottom:8px}
.d-body .txt .key{font-size:17px;font-weight:700;color:var(--green-d);background:#ecfdf5;padding:10px 20px;border-radius:10px;margin:12px 0}
.d-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#fff;border-top:1px solid var(--gray-200);flex-shrink:0}
.d-nav button{padding:7px 18px;border-radius:8px;border:1px solid var(--gray-300);background:#fff;color:var(--gray-700);font-size:13px;cursor:pointer;transition:all .2s}
.d-nav button:hover{background:var(--green-l);color:#fff;border-color:var(--green-l)}
.d-nav .dots{display:flex;gap:5px}
.d-nav .dot{width:7px;height:7px;border-radius:50%;background:var(--gray-300);transition:all .3s}
.d-nav .dot.visited{background:var(--green-l)}
.d-nav .dot.current{background:var(--green-d);transform:scale(1.3)}

/* Animations */
@keyframes flowR{0%{opacity:0;transform:translateX(-15px)}50%{opacity:1}100%{opacity:0;transform:translateX(15px)}}
@keyframes flowL{0%{opacity:0;transform:translateX(15px)}50%{opacity:1}100%{opacity:0;transform:translateX(-15px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes draw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px var(--amber-l))}50%{filter:drop-shadow(0 0 10px var(--amber-l))}}
.a-flow{animation:flowR 1.5s ease-in-out infinite}
.a-flow-r{animation:flowL 1.5s ease-in-out infinite}
.a-pulse{animation:pulse 1.5s ease-in-out infinite}
.a-draw{stroke-dasharray:300;animation:draw 1.5s ease-out forwards}
.a-fade{animation:fadeUp .6s ease-out forwards}
.a-glow{animation:glow 2s ease-in-out infinite}

@media(max-width:768px){.d-body{padding:12px}.d-body .txt h3{font-size:17px}.d-body .txt p{font-size:13px}.d-header h2{font-size:14px}.d-nav button{padding:5px 12px;font-size:11px}}
</style>
</head>

function show(i){

// Event listeners
document.querySelectorAll('.hotspot').forEach(el=>{
  el.addEventListener('click',()=>{
    const s=parseInt(el.dataset.s);
    show(s-1);
  });
});
document.addEventListener('keydown',e=>{
  if(document.getElementById('detail').classList.contains('active')){
    if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();nav(1)}
    if(e.key==='ArrowLeft'){e.preventDefault();nav(-1)}
    if(e.key==='Escape'){e.preventDefault();back()}
  }else{
    if(e.key==='Enter'){e.preventDefault();show(0)}
  }
  if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement)document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});
</script>
</body>
