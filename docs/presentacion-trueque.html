<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cómo funciona el Trueque Federado - Presentación Interactiva</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --green: #059669; --green-light: #10b981; --green-dark: #047857;
  --blue: #2563eb; --blue-light: #3b82f6; --blue-dark: #1d4ed8;
  --amber: #d97706; --amber-light: #f59e0b; --amber-dark: #b45309;
  --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
  --gray-300: #d1d5db; --gray-500: #6b7280; --gray-700: #374151; --gray-900: #111827;
  --white: #ffffff;
}
body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: var(--gray-50); color: var(--gray-900); overflow: hidden;
  height: 100vh; width: 100vw;
}
/* ===== OVERVIEW ===== */
#overview {
  width: 100vw; height: 100vh; position: relative;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, #ecfdf5 0%, #f0fdf4 40%, var(--gray-50) 100%);
  transition: opacity 0.4s ease;
}
#overview.hidden { opacity: 0; pointer-events: none; position: absolute; }
#overview svg { width: 95%; height: 95%; max-width: 1200px; }
.clickable { cursor: pointer; transition: filter 0.2s; }
.clickable:hover { filter: brightness(1.1) drop-shadow(0 0 8px rgba(16,185,129,0.4)); }
.clickable:hover .zone-bg { opacity: 0.15; }
.zone-bg { fill: var(--green-light); opacity: 0; transition: opacity 0.2s; }
.zone-label { font-size: 11px; fill: var(--gray-700); font-weight: 600; text-anchor: middle; pointer-events: none; }
.zone-hint { font-size: 9px; fill: var(--gray-500); text-anchor: middle; pointer-events: none; opacity: 0.7; }

/* ===== DETAIL VIEW ===== */
#detail {
  width: 100vw; height: 100vh; position: fixed; top: 0; left: 0;
  background: var(--white); display: none; flex-direction: column;
  z-index: 100; animation: fadeIn 0.4s ease;
}
#detail.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.detail-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px; background: var(--gray-50); border-bottom: 1px solid var(--gray-200);
  flex-shrink: 0;
}
.detail-header h2 { font-size: 18px; color: var(--gray-900); }
.detail-header .section-num { font-size: 12px; color: var(--gray-500); }
.detail-body {
  flex: 1; overflow-y: auto; padding: 32px 24px;
  display: flex; flex-direction: column; align-items: center;
}
.detail-body svg { max-width: 900px; width: 100%; height: auto; }
.detail-body .text-content { max-width: 700px; text-align: center; margin-top: 20px; }
.detail-body .text-content h3 { font-size: 22px; margin-bottom: 12px; color: var(--gray-900); }
.detail-body .text-content p { font-size: 16px; line-height: 1.7; color: var(--gray-700); margin-bottom: 10px; }
.detail-body .text-content .key-msg {
  font-size: 18px; font-weight: 700; color: var(--green-dark);
  background: #ecfdf5; padding: 12px 24px; border-radius: 12px; margin: 16px 0;
}
.detail-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px; background: var(--gray-50); border-top: 1px solid var(--gray-200);
  flex-shrink: 0;
}
.detail-nav button {
  padding: 8px 20px; border-radius: 10px; border: 1px solid var(--gray-300);
  background: var(--white); color: var(--gray-700); font-size: 14px; cursor: pointer;
  transition: all 0.2s;
}
.detail-nav button:hover { background: var(--green-light); color: var(--white); border-color: var(--green-light); }
.detail-nav .progress-dots { display: flex; gap: 6px; }
.detail-nav .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray-300); transition: background 0.3s; }
.detail-nav .dot.visited { background: var(--green-light); }
.detail-nav .dot.current { background: var(--green-dark); transform: scale(1.3); }

/* ===== ANIMATIONS ===== */
@keyframes flowRight { 0% { opacity: 0; transform: translateX(-20px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateX(20px); } }
@keyframes flowLeft { 0% { opacity: 0; transform: translateX(20px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateX(-20px); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes drawLine { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes scaleIn { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes glow { 0%, 100% { filter: drop-shadow(0 0 2px var(--amber-light)); } 50% { filter: drop-shadow(0 0 12px var(--amber-light)); } }
.anim-flow { animation: flowRight 1.5s ease-in-out infinite; }
.anim-flow-rev { animation: flowLeft 1.5s ease-in-out infinite; }
.anim-pulse { animation: pulse 1.5s ease-in-out infinite; }
.anim-draw { stroke-dasharray: 200; animation: drawLine 1.5s ease-out forwards; }
.anim-fade-up { animation: fadeInUp 0.6s ease-out forwards; }
.anim-bounce { animation: bounce 1s ease-in-out infinite; }
.anim-glow { animation: glow 2s ease-in-out infinite; }

/* ===== INTERACTIVE ELEMENTS ===== */
.sub-clickable { cursor: pointer; transition: all 0.2s; }
.sub-clickable:hover { filter: brightness(1.15); }
.play-btn {
  padding: 10px 28px; border-radius: 12px; border: none;
  background: var(--green-light); color: var(--white); font-size: 15px;
  font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 16px;
}
.play-btn:hover { background: var(--green-dark); transform: scale(1.05); }
.info-box {
  background: var(--gray-50); border: 1px solid var(--gray-200);
  border-radius: 12px; padding: 16px 24px; margin-top: 12px; max-width: 600px;
}
.info-box .label { font-size: 12px; color: var(--gray-500); text-transform: uppercase; }
.info-box .value { font-size: 20px; font-weight: 700; color: var(--gray-900); margin-top: 4px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .detail-body { padding: 16px 12px; }
  .detail-body .text-content h3 { font-size: 18px; }
  .detail-body .text-content p { font-size: 14px; }
  .detail-header h2 { font-size: 15px; }
  .detail-nav button { padding: 6px 14px; font-size: 12px; }
}
</style>
</head>

function showDetail(sectionIdx) {
  currentSection = sectionIdx;

  document.getElementById('detail-title').textContent = s.title;
  document.getElementById('detail-num').textContent = s.num;

  document.getElementById('overview').classList.add('hidden');
  document.getElementById('detail').classList.add('active');
  updateProgress();
  // Disparar animaciones después de insertar
  setTimeout(triggerAnimations, 100);
}

function navigate(dir) {
  const next = currentSection + dir;
  if (next >= 0 && next < sections.length) showDetail(next);
}

function updateProgress() {
  const dots = document.getElementById('progress-dots');
  dots.innerHTML = sections.map((_, i) => {
    let cls = 'dot';
    if (visited.has(i)) cls += ' visited';
    if (i === currentSection) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');
}

  document.querySelectorAll('#detail-body .anim-draw').forEach(el => {

// Event listeners
document.querySelectorAll('.clickable').forEach(el => {
  el.addEventListener('click', () => {
    const section = parseInt(el.dataset.section);
    showDetail(section - 1); // sections array is 0-indexed
  });
});

document.addEventListener('keydown', (e) => {
  if (document.getElementById('detail').classList.contains('active')) {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); navigate(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); navigate(-1); }
    if (e.key === 'Escape') { e.preventDefault(); backToOverview(); }
  } else {
    if (e.key === 'Enter') { e.preventDefault(); showDetail(0); }
  }
  if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});
</script>
