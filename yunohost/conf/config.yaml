node:
  domain: "__DOMAIN__"
  name: "__NODE_NAME__"

database:
  host: "127.0.0.1"
  port: 5432
  name: "__DB_NAME__"
  user: "__DB_USER__"
  password: "__DB_PWD__"
  ssl_mode: "disable"

api:
  port: __PORT__
  cors_origins:
    - "https://__DOMAIN__"
    - "http://localhost:__PORT__"

federation:
  listen_port: __PORT_FEDERATION__
  mtls_required: true
  known_nodes: []
  gossip_interval: "60s"
  balance_sync_enabled: true

limits:
  node_multilateral_negative: -10000000
  node_multilateral_positive: 10000000
  default_individual_negative: -50000
  default_individual_positive: 50000
  default_organization_negative: -5000000
  default_organization_positive: 5000000

taxes:
  individual:
    rate: 0.0
    enabled: false
  organization:
    default_rate: 0.05
    by_type:
      commerce: 0.05
      services: 0.03
      public_service: 0.0
      cooperative: 0.02

fund:
  account_username: "fund"
  multisig_required: 3
  multisig_authorizers: []
