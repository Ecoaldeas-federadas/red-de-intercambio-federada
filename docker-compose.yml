services:
  node-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./secrets:/secrets:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./firmware:/app/firmware:ro
      - firmware_builds:/tmp/firmware-builds
      - uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - yugabytedb
    environment:
      - DB_HOST=yugabytedb
      - DB_PASSWORD=${DB_PASSWORD:-fmcpassword}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CONFIG_PATH=/app/config.yaml
      - MIGRATIONS_DIR=/app/internal/db/migrations
      - FIRMWARE_DIR=/app/firmware
      - FIRMWARE_BUILD_DIR=/tmp/firmware-builds
      - FIRMWARE_DOCKER_IMAGE=fmc-arduino-compiler:latest
    restart: unless-stopped

  arduino-compiler:
    build:
      context: .
      dockerfile: docker/Dockerfile.arduino-compiler
    image: fmc-arduino-compiler:latest
    profiles: ["compiler"]
    volumes:
      - firmware_builds:/build-output

  yugabytedb:
    image: yugabytedb/yugabyte:latest
    hostname: yugabytedb
    command: ["bin/yugabyted", "start", "--base_dir=/mnt/master", "--daemon=false"]
    ports:
      - "5433:5433"
      - "7000:7000"
      - "9000:9000"
    volumes:
      - yb_data:/mnt/master
      - yb_tserver:/mnt/tserver
      - db_backups:/backups
    environment:
      - YUGABYTE_DB_USER=fmc
      - YUGABYTE_DB_PASSWORD=fmcpassword
    restart: unless-stopped

  # Backup automatico diario de la base de datos
  # Exporta un dump SQL completo cada 24h a /backups
  # Los backups se guardan en el volumen db_backups (persistente)
  # Para restaurar: copiar el archivo .sql al servidor y ejecutarlo
  db-backup:
    image: yugabytedb/yugabyte:latest
    depends_on:
      - yugabytedb
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Backup service: esperando a que YugabyteDB este listo..."
        sleep 90
        while true; do
          DATE=$$(date +%Y%m%d_%H%M%S)
          FILE="/backups/fmc_node_$$DATE.sql"
          echo "Backup service: creando backup $$FILE"
          /home/yugabyte/bin/ysqlsh -h yugabytedb -p 5433 -U yugabyte -d fmc_node -c "COPY (SELECT 'BACKUP ' || to_char(now(),'YYYY-MM-DD HH24:MI:SS')) TO STDOUT" > /dev/null 2>&1
          if [ $$? -ne 0 ]; then
            echo "Backup service: BD no lista, reintentando en 5 min"
            sleep 300
            continue
          fi
          # Exportar todas las tablas principales
          {
            echo "-- Backup automatico $$DATE"
            echo "-- Base de datos: fmc_node"
            echo ""
            echo "-- Paginas publicas"
            /home/yugabyte/bin/ysqlsh -h yugabytedb -p 5433 -U yugabyte -d fmc_node -c "SELECT * FROM public_pages;" 2>/dev/null
            echo ""
            echo "-- Configuracion del nodo"
            /home/yugabyte/bin/ysqlsh -h yugabytedb -p 5433 -U yugabyte -d fmc_node -c "SELECT * FROM node_config;" 2>/dev/null
            echo ""
            echo "-- Usuarios"
            /home/yugabyte/bin/ysqlsh -h yugabytedb -p 5433 -U yugabyte -d fmc_node -c "SELECT id, username, node_domain, role, is_active FROM users;" 2>/dev/null
            echo ""
            echo "-- Productos"
            /home/yugabyte/bin/ysqlsh -h yugabytedb -p 5433 -U yugabyte -d fmc_node -c "SELECT * FROM products;" 2>/dev/null
            echo ""
            echo "-- Departamentos"
            /home/yugabyte/bin/ysqlsh -h yugabytedb -p 5433 -U yugabyte -d fmc_node -c "SELECT * FROM departments;" 2>/dev/null
            echo ""
            echo "-- Organizaciones"
            /home/yugabyte/bin/ysqlsh -h yugabytedb -p 5433 -U yugabyte -d fmc_node -c "SELECT * FROM organizations;" 2>/dev/null
            echo ""
            echo "-- Transacciones"
            /home/yugabyte/bin/ysqlsh -h yugabytedb -p 5433 -U yugabyte -d fmc_node -c "SELECT * FROM transactions;" 2>/dev/null
          } > $$FILE
          if [ -s $$FILE ]; then
            echo "Backup service: backup OK $$FILE ($$(wc -c < $$FILE) bytes)"
            # Mantener solo los ultimos 7 backups
            ls -t /backups/fmc_node_*.sql 2>/dev/null | tail -n +8 | xargs rm -f 2>/dev/null
          else
            echo "Backup service: backup vacio, reintentando en 1h"
            rm -f $$FILE
            sleep 3600
            continue
          fi
          echo "Backup service: proximo backup en 24h"
          sleep 86400
        done
    volumes:
      - db_backups:/backups
    restart: unless-stopped

  # === Nodo Demo ===
  # Nodo parasito: NO arranca solo. Se inicia desde un boton en la pagina web.
  # Cualquier visitante puede iniciarlo con POST /api/demo/start.
  # Se detiene automaticamente despues de 24h para no gastar recursos.
  # BD separada (fmc_demo), mismo servidor YugabyteDB.
  # Al arrancar hace auto-setup + seed (sistema completo con datos demo).
  demo-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "9091:9091"
      - "9044:9044"
    volumes:
      - ./config.demo.yaml:/app/config.yaml:ro
      - ./firmware:/app/firmware:ro
      - demo_uploads:/app/uploads
    depends_on:
      - yugabytedb
    environment:
      - DB_HOST=yugabytedb
      - DB_NAME=fmc_demo
      - DB_PASSWORD=${DB_PASSWORD:-fmcpassword}
      - JWT_SECRET=demo-jwt-secret-not-for-production
      - CONFIG_PATH=/app/config.yaml
      - MIGRATIONS_DIR=/app/internal/db/migrations
      - FIRMWARE_DIR=/app/firmware
      - FIRMWARE_BUILD_DIR=/tmp/firmware-builds
      - FIRMWARE_DOCKER_IMAGE=fmc-arduino-compiler:latest
      - DEMO_MODE=true
      - DEMO_DOMAIN=demo
      - DEMO_AUTO_STOP_HOURS=24
    # NO auto-inicia. Se arranca bajo demanda desde la pagina web.
    profiles: ["demo"]
    restart: "no"

  # Controlador del nodo demo:
  # Contenedor ligero basado en docker:cli que siempre esta corriendo.
  # Expone un HTTP endpoint simple para iniciar/detener el nodo demo.
  # El nodo principal le envia HTTP requests (no necesita docker CLI instalado).
  demo-controller:
    image: docker:cli
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Demo controller: iniciando en puerto 9100..."
        while true; do
          # Escuchar peticiones HTTP simples con nc
          REQUEST=$$(nc -l -p 9100 -w 5 2>/dev/null)
          PATH_LINE=$$(echo "$$REQUEST" | head -1)
          
          if echo "$$PATH_LINE" | grep -q "POST /start"; then
            echo "Demo controller: arrancando demo-app..."
            docker start demo-app 2>/dev/null || docker compose -f /project/docker-compose.yml --profile demo up -d demo-app 2>/dev/null || true
            RESPONSE="HTTP/1.1 200 OK\r\nContent-Type: application/json\r\n\r\n{\"running\":true,\"message\":\"demo iniciado\"}"
          elif echo "$$PATH_LINE" | grep -q "POST /stop"; then
            echo "Demo controller: deteniendo demo-app..."
            docker stop demo-app 2>/dev/null || true
            RESPONSE="HTTP/1.1 200 OK\r\nContent-Type: application/json\r\n\r\n{\"running\":false,\"message\":\"demo detenido\"}"
          elif echo "$$PATH_LINE" | grep -q "GET /status"; then
            RUNNING=$$(docker inspect -f '{{.State.Running}}' demo-app 2>/dev/null || echo "false")
            RESPONSE="HTTP/1.1 200 OK\r\nContent-Type: application/json\r\n\r\n{\"running\":$$RUNNING}"
          else
            RESPONSE="HTTP/1.1 200 OK\r\nContent-Type: application/json\r\n\r\n{\"status\":\"demo-controller running\"}"
          fi
          
          echo -e "$$RESPONSE" | nc -l -p 9100 -w 1 2>/dev/null || true
        done
    ports:
      - "9100:9100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro
    restart: unless-stopped

  # Detenedor automatico del nodo demo:
  # Corre siempre, cada 24h detiene demo-app si esta corriendo.
  # Usa comando directo (no script archivo) para evitar problemas de CRLF.
  demo-stopper:
    image: docker:cli
    environment:
      - DEMO_AUTO_STOP_HOURS=24
    entrypoint:
      - /bin/sh
      - -c
      - |
        INTERVAL=$${DEMO_AUTO_STOP_HOURS:-24}
        echo "Demo stopper: detendra demo-app cada $${INTERVAL} horas."
        while true; do
          echo "Demo stopper: esperando $${INTERVAL} horas..."
          sleep $${INTERVAL}h 2>/dev/null || sleep 86400
          echo "Demo stopper: deteniendo demo-app..."
          docker stop demo-app 2>/dev/null || true
          echo "Demo stopper: demo-app detenido."
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  yb_data:
  yb_tserver:
  db_backups:
  firmware_builds:
  uploads:
  demo_uploads:
