services:
  node-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./secrets:/secrets:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./firmware:/app/firmware:ro
      - firmware_builds:/tmp/firmware-builds
      - uploads:/app/uploads
      - db_backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - yugabytedb
    environment:
      - DB_HOST=yugabytedb
      - DB_PASSWORD=${DB_PASSWORD:-fmcpassword}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CONFIG_PATH=/app/config.yaml
      - MIGRATIONS_DIR=/app/internal/db/migrations
      - FIRMWARE_DIR=/app/firmware
      - FIRMWARE_BUILD_DIR=/tmp/firmware-builds
      - FIRMWARE_DOCKER_IMAGE=fmc-arduino-compiler:latest
    restart: unless-stopped

  arduino-compiler:
    build:
      context: .
      dockerfile: docker/Dockerfile.arduino-compiler
    image: fmc-arduino-compiler:latest
    profiles: ["compiler"]
    volumes:
      - firmware_builds:/build-output

  # === POS Web (Punto de Venta separado) ===
  # App 100% frontend (PWA instalable) que se sirve como static files.
  # Se comunica con el nodo via API (no necesita backend propio).
  # Puerto 3001 por defecto. Se puede cambiar con POS_PORT.
  # El POS se conecta al nodo en la URL que el usuario configura al abrirlo.
  pos-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.pos
    ports:
      - "${POS_PORT:-3001}:80"
    restart: unless-stopped

  # YugabyteDB: comando original que funcionaba.
  # Los flags --tserver_flags causaban crash en esta version de yugabyted.
  # El limite de tabletas se maneja via colocation en la BD, no via flags.
  yugabytedb:
    image: yugabytedb/yugabyte:latest
    hostname: yugabytedb
    command: ["bin/yugabyted", "start", "--base_dir=/mnt/master", "--daemon=false"]
    ports:
      - "5433:5433"
      - "7000:7000"
      - "9000:9000"
    volumes:
      - yb_data:/mnt/master
      - yb_tserver:/mnt/tserver
      - db_backups:/backups
    environment:
      - YUGABYTE_DB_USER=fmc
      - YUGABYTE_DB_PASSWORD=fmcpassword
    restart: unless-stopped

  # Backup automatico de la base de datos
  # Lee configuracion de /backups/config.json (escrito por el backend)
  # - interval_hours: cada cuanto hacer backup
  # - retention_days: cuantos dias mantener backups (los .lock nunca se borran)
  # - enabled: activar/desactivar
  # Trigger manual: si existe /backups/.trigger_now, hace backup inmediato
  db-backup:
    image: yugabytedb/yugabyte:latest
    depends_on:
      - yugabytedb
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Backup service: esperando a que YugabyteDB este listo..."
        sleep 90
        LAST_BACKUP=0
        echo "idle" > /backups/.backup_status
        while true; do
          INTERVAL=24
          RETENTION=7
          ENABLED=true
          if [ -f /backups/config.json ]; then
            INTERVAL=$$(grep -o '"interval_hours":[0-9]*' /backups/config.json | grep -o '[0-9]*')
            RETENTION=$$(grep -o '"retention_days":[0-9]*' /backups/config.json | grep -o '[0-9]*')
            ENABLED=$$(grep -o '"enabled":[a-z]*' /backups/config.json | grep -o 'true\|false')
          fi
          INTERVAL=$${INTERVAL:-24}
          RETENTION=$${RETENTION:-7}
          ENABLED=$${ENABLED:-true}

          TRIGGER=0
          if [ -f /backups/.trigger_now ]; then
            TRIGGER=1
            rm -f /backups/.trigger_now
          fi

          NOW=$$(date +%s)
          ELAPSED=$$((NOW - LAST_BACKUP))
          NEED_BACKUP=0
          if [ "$$TRIGGER" = "1" ]; then NEED_BACKUP=1; fi
          if [ "$$ENABLED" = "true" ] && [ $$ELAPSED -ge $$((INTERVAL * 3600)) ]; then NEED_BACKUP=1; fi

          if [ $$NEED_BACKUP -eq 1 ]; then
            echo "creating" > /backups/.backup_status
            /home/yugabyte/bin/ysqlsh -h yugabytedb -p 5433 -U yugabyte -d fmc_node -c "SELECT 1" > /dev/null 2>&1
            if [ $$? -ne 0 ]; then
              echo "Backup service: BD no lista, reintentando en 5 min"
              echo "error: BD no lista" > /backups/.backup_status
              sleep 300
              echo "idle" > /backups/.backup_status
              continue
            fi
            DATE=$$(date +%Y%m%d_%H%M%S)
            FILE="/backups/fmc_node_$$DATE.sql"
            echo "Backup service: creando backup $$FILE"
            /home/yugabyte/bin/pg_dump -h yugabytedb -p 5433 -U yugabyte -d fmc_node --data-only --column-inserts > $$FILE 2>/dev/null
            if [ ! -s $$FILE ]; then
              echo "Backup service: pg_dump vacio, intentando con ysqlsh"
              /home/yugabyte/bin/ysqlsh -h yugabytedb -p 5433 -U yugabyte -d fmc_node --command="COPY (SELECT '-- pg_dump no disponible, backup vacio'::text) TO STDOUT" > $$FILE 2>/dev/null
            fi
            echo "-- Backup $$DATE" >> $$FILE
            echo "-- Base de datos: fmc_node" >> $$FILE
            if [ -s $$FILE ]; then
              echo "Backup service: backup OK $$FILE ($$(wc -c < $$FILE) bytes)"
              echo "done: $$FILE" > /backups/.backup_status
              LAST_BACKUP=$$NOW
              find /backups -name "fmc_node_*.sql" -mtime +$$RETENTION 2>/dev/null | while read f; do
                if [ ! -f "$$f.lock" ]; then
                  rm -f "$$f"
                  echo "Backup service: borrado $$f (mayor a $$RETENTION dias)"
                fi
              done
            else
              echo "Backup service: backup vacio, reintentando en 1h"
              echo "error: backup vacio" > /backups/.backup_status
              rm -f $$FILE
              sleep 3600
              echo "idle" > /backups/.backup_status
              continue
            fi
          fi
          sleep 60
          echo "idle" > /backups/.backup_status 2>/dev/null
        done
    volumes:
      - db_backups:/backups
    restart: unless-stopped

  # === Nodo Demo ===
  # Nodo parasito: NO arranca solo. Se inicia desde un boton en la pagina web.
  # Cualquier visitante puede iniciarlo con POST /api/demo/start.
  # Se detiene automaticamente despues de 24h para no gastar recursos.
  # BD separada (fmc_demo), mismo servidor YugabyteDB.
  # Al arrancar hace auto-setup + seed (sistema completo con datos demo).
  demo-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "9091:9091"
      - "9044:9044"
    volumes:
      - ./firmware:/app/firmware:ro
      - demo_uploads:/app/uploads
    depends_on:
      - yugabytedb
    environment:
      - DB_HOST=yugabytedb
      - DB_NAME=fmc_demo
      - DB_PASSWORD=${DB_PASSWORD:-fmcpassword}
      - JWT_SECRET=demo-jwt-secret-not-for-production
      - CONFIG_PATH=/app/config.demo.yaml
      - MIGRATIONS_DIR=/app/internal/db/migrations
      - FIRMWARE_DIR=/app/firmware
      - FIRMWARE_BUILD_DIR=/tmp/firmware-builds
      - FIRMWARE_DOCKER_IMAGE=fmc-arduino-compiler:latest
      - DEMO_MODE=true
      - DEMO_DOMAIN=demo
      - DEMO_AUTO_STOP_HOURS=24
    # NO auto-inicia con docker compose up -d normal.
    # Se crea con: docker compose --profile demo up -d --no-deps demo-app
    # El demo-controller lo arranca/detiene con docker start/stop.
    profiles: ["demo"]
    restart: "no"

  # Controlador del nodo demo:
  # Contenedor ligero basado en docker:cli que siempre esta corriendo.
  # Expone un HTTP endpoint simple para iniciar/detener el nodo demo.
  # El nodo principal le envia HTTP requests (no necesita docker CLI instalado).
  demo-controller:
    image: docker:cli
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Demo controller: iniciando en puerto 9100..."
        while true; do
          # Escuchar peticiones HTTP simples con nc
          REQUEST=$$(nc -l -p 9100 -w 5 2>/dev/null)
          PATH_LINE=$$(echo "$$REQUEST" | head -1)
          
          if echo "$$PATH_LINE" | grep -q "POST /start"; then
            echo "Demo controller: arrancando demo-app..."
            # Intentar start directo primero
            docker start red-de-intercambio-federada-demo-app-1 2>/dev/null || docker start demo-app 2>/dev/null
            if [ $$? -ne 0 ]; then
              # Si no existe, crearlo con compose (--no-deps para no crear otro yugabytedb)
              echo "Demo controller: creando demo-app con compose..."
              cd /project && docker compose --profile demo up -d --no-deps demo-app 2>&1 || true
            fi
            RESPONSE="HTTP/1.1 200 OK\r\nContent-Type: application/json\r\n\r\n{\"running\":true,\"message\":\"demo iniciado\"}"
          elif echo "$$PATH_LINE" | grep -q "POST /stop"; then
            echo "Demo controller: deteniendo demo-app..."
            docker stop red-de-intercambio-federada-demo-app-1 2>/dev/null || docker stop demo-app 2>/dev/null || true
            RESPONSE="HTTP/1.1 200 OK\r\nContent-Type: application/json\r\n\r\n{\"running\":false,\"message\":\"demo detenido\"}"
          elif echo "$$PATH_LINE" | grep -q "GET /status"; then
            RUNNING=$$(docker inspect -f '{{.State.Running}}' red-de-intercambio-federada-demo-app-1 2>/dev/null || docker inspect -f '{{.State.Running}}' demo-app 2>/dev/null || echo "false")
            RESPONSE="HTTP/1.1 200 OK\r\nContent-Type: application/json\r\n\r\n{\"running\":$$RUNNING}"
          else
            RESPONSE="HTTP/1.1 200 OK\r\nContent-Type: application/json\r\n\r\n{\"status\":\"demo-controller running\"}"
          fi
          
          echo -e "$$RESPONSE" | nc -l -p 9100 -w 1 2>/dev/null || true
        done
    ports:
      - "9100:9100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro
    restart: unless-stopped

  # Detenedor automatico del nodo demo:
  # Corre siempre, cada 24h detiene demo-app si esta corriendo.
  # Usa comando directo (no script archivo) para evitar problemas de CRLF.
  demo-stopper:
    image: docker:cli
    environment:
      - DEMO_AUTO_STOP_HOURS=24
    entrypoint:
      - /bin/sh
      - -c
      - |
        INTERVAL=$${DEMO_AUTO_STOP_HOURS:-24}
        echo "Demo stopper: detendra demo-app cada $${INTERVAL} horas."
        while true; do
          echo "Demo stopper: esperando $${INTERVAL} horas..."
          sleep $${INTERVAL}h 2>/dev/null || sleep 86400
          echo "Demo stopper: deteniendo demo-app..."
          docker stop red-de-intercambio-federada-demo-app-1 2>/dev/null || docker stop demo-app 2>/dev/null || true
          echo "Demo stopper: demo-app detenido."
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  yb_data:
  yb_tserver:
  db_backups:
  firmware_builds:
  uploads:
  demo_uploads:
