#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "red-intercambio"
name = "Red de Intercambio"
description.en = "Decentralized zero-sum mutual credit accounting and federated barter network node"
description.es = "Nodo de contabilidad descentralizada, crédito mutuo de suma cero y trueque federado"

version = "1.0.0~ynh1"

maintainers = ["discapacidad5"]

[upstream]
license = "LicenseRef-LPF-1.0"
license_url = "https://github.com/discapacidad5/red-de-intercambio-federada/blob/main/LICENSE"
code = "https://github.com/discapacidad5/red-de-intercambio-federada"
admindoc = "https://github.com/discapacidad5/red-de-intercambio-federada/blob/main/docs/deployment.md"
userdoc = "https://github.com/discapacidad5/red-de-intercambio-federada/blob/main/docs/guia-usuario.md"

[integration]
yunohost = ">= 11.2.8"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = false
sso = false
disk = "500M"
ram.build = "1G"
ram.runtime = "256M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    ask.en = "Administrator password for the node"
    ask.es = "Contraseña del administrador del nodo"
    help.en = "Used to encrypt the administrator's Ed25519 cryptographic signing keys (minimum 8 characters)."
    help.es = "Se utiliza para cifrar las claves criptográficas Ed25519 del administrador (mínimo 8 caracteres)."
    type = "password"

    [install.node_name]
    ask.en = "Community node name"
    ask.es = "Nombre del nodo comunitario"
    help.en = "Public display name of your community barter node (e.g. Banco Comunitario A)."
    help.es = "Nombre público de tu nodo de intercambio comunitario (ej: Banco Comunitario A)."
    type = "string"
    default = "Nodo Comunitario"
    example = "Banco Comunitario A"

    [install.default_language]
    ask.en = "Default interface language"
    ask.es = "Idioma predeterminado de la interfaz"
    type = "select"
    choices.es = "Español"
    choices.en = "English"
    choices.pt = "Português"
    choices.fr = "Français"
    default = "es"

    [install.preset]
    ask.en = "Node preset / sample data"
    ask.es = "Preconfiguración del nodo / datos de muestra"
    help.en = "Installs schedules, catalog rules, colors and sample data for this community type. Everything can be changed later."
    help.es = "Instala horarios, reglas de catálogo, colores y datos de muestra según el tipo de comunidad. Todo se puede cambiar después."
    type = "select"
    default = "vacio"
    choices.vacio = "Vacío (sin datos preconfigurados)"
    choices.adventista = "Adventistas del Séptimo Día"
    choices.amish = "Amish / Menonitas"
    choices.hutterita = "Hutteritas"
    choices.bruderhof = "Bruderhof"
    choices.cuakero = "Cuáqueros (Quakers)"
    choices.catholic_land = "Catholic Land Movement"
    choices.monasterio = "Monasterios (Trapenses/Ortodoxos)"
    choices.twelve_tribes = "Twelve Tribes"
    choices.camphill = "Camphill (Antroposófica)"
    choices.baye_fall = "Muridiyya / Baye Fall (Senegal)"
    choices.oasis_sufi = "Oasis Sufi"
    choices.granjas_halal = "Granjas Halal"
    choices.kibbutz = "Kibbutz Lotan (Eco-judaísmo)"
    choices.iskcon = "ISKCON / Hare Krishna"
    choices.plum_village = "Plum Village (Budistas)"
    choices.sikh = "Sikh - Khalsa Garden"
    choices.bahai = "Baha'i - Adasiyyih"
    choices.andino = "Andinos - Ayllu/Ayni/Minka"
    choices.mesoamericano = "Mesoamericanos - Milpa/Toltecayotl"
    choices.ubuntu = "Ubuntu / Ujamaa (Tanzania)"
    choices.findhorn = "Findhorn (Escocia)"
    choices.ecosalde_espiritual = "Ecoaldeas Espirituales"
    choices.pagano = "Wiccan / Druida / Pagano"
    choices.transition_town = "Transition Towns"
    choices.gen_ecoaldea = "GEN - Ecoaldea Secular"
    choices.convivencialidad = "Convivencialidad (Ivan Illich)"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["uploads", "backups", "secrets", "html"]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8080

    [resources.apt]
    packages = [
        "postgresql",
        "postgresql-contrib",
        "git",
        "curl",
        "openssl",
        "ca-certificates",
        "build-essential"
    ]

    [resources.database]
    type = "postgresql"

    [resources.go]
    version = "1.25"

    [resources.nodejs]
    version = "20"
